<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求状态追踪助手 · POC</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EDF1F7;color:#12293F;font-size:13px;
       font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:16px auto;height:calc(100vh - 32px);min-height:600px;background:#fff;
        border:1px solid #E3E8EF;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
        box-shadow:0 6px 24px rgba(24,44,72,.06)}

  /* 顶栏：身份 */
  .top{flex:0 0 auto;padding:13px 18px 11px;background:#F7F9FC;border-bottom:1px solid #E3E8EF}
  .top .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#12293F}
  .brand .ico{width:22px;height:22px;border-radius:6px;background:#E6F1FB;color:#185FA5;
              display:flex;align-items:center;justify-content:center;font-size:12px}
  .brand .sub{font-size:11px;font-weight:400;color:#8A98A8;margin-left:2px}
  .grow{flex:1}
  .who{display:flex;align-items:center;gap:6px;font-size:12px;color:#5B6B7C}
  .who select,.who input{font-family:inherit;font-size:12px;color:#12293F;padding:5px 8px;background:#fff;
        border:1px solid #D7DFE9;border-radius:7px;outline:none}
  .who select{min-width:196px}
  .who input{width:104px}
  .who select:focus,.who input:focus{border-color:#3E6CDB;box-shadow:0 0 0 2px rgba(62,108,219,.12)}
  .btn{font-family:inherit;font-size:12px;padding:5px 12px;border-radius:7px;border:1px solid #3E6CDB;
       background:#3E6CDB;color:#fff;cursor:pointer}
  .btn:hover{background:#3563CE}
  .btn.ghost{background:#fff;color:#3E6CDB}
  .btn.ghost:hover{background:#F2F6FF}
  .btn:disabled{background:#C7D2E0;border-color:#C7D2E0;cursor:not-allowed}

  /* 权限条 */
  .scope{flex:0 0 auto;display:flex;align-items:flex-start;gap:8px;padding:8px 18px;font-size:11.5px;
         line-height:1.65;background:#F2F7FD;border-bottom:1px solid #E3E8EF;color:#3F5B78}
  .scope .tag{flex:0 0 auto;font-size:10px;padding:1px 6px;border-radius:4px;background:#E6F1FB;color:#185FA5;
              margin-top:1px}
  .scope.warn{background:#FFF8EC;border-bottom-color:#F0E2C8;color:#7A5A1E}
  .scope.warn .tag{background:#FCEFD4;color:#8A5A00}
  .scope b{font-weight:600}

  /* 消息区 */
  .msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:#FCFDFE}
  .bub{max-width:88%;padding:10px 12px;border-radius:10px;font-size:12.8px;line-height:1.78;word-break:break-word}
  .bub-u{align-self:flex-end;background:#3E6CDB;color:#fff;border-bottom-right-radius:3px}
  .bub-a{align-self:flex-start;background:#F4F7FA;color:#2C4356;border-bottom-left-radius:3px;max-width:94%}
  .bub-a p{margin:0 0 6px}.bub-a p:last-child{margin-bottom:0}
  .bub-a ul,.bub-a ol{margin:4px 0 6px;padding-left:18px}
  .bub-a li{margin:2px 0}
  .bub-a strong{color:#12293F}
  .bub-a code{background:#E9EEF5;color:#1B4B7A;padding:1px 4px;border-radius:3px;font-size:11.5px;
              font-family:Consolas,Menlo,monospace}
  .bub-a h3{font-size:12.8px;margin:8px 0 4px;color:#12293F}
  .bub-a table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px}
  .bub-a th,.bub-a td{border:1px solid #DFE6EF;padding:4px 7px;text-align:left;vertical-align:top}
  .bub-a th{background:#EEF3F9;font-weight:600;color:#2C4356}
  .bub-a tbody tr:nth-child(even) td{background:#FAFCFE}
  .meta{font-size:11px;color:#96A3B2;margin-top:7px}
  .typing{align-self:flex-start;display:flex;align-items:center;gap:6px;color:#8A98A8;font-size:12px;
          background:#F4F7FA;padding:8px 12px;border-radius:10px}
  .dot{width:5px;height:5px;border-radius:50%;background:#9FB0C2;display:inline-block;animation:bl 1.1s infinite}
  .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* 快捷问题 */
  .chips{flex:0 0 auto;display:flex;gap:7px;padding:9px 18px 0;flex-wrap:wrap}
  .chip{font-size:11.5px;color:#3F5B78;background:#fff;border:1px solid #DCE4EE;border-radius:14px;
        padding:4px 11px;cursor:pointer}
  .chip:hover{border-color:#3E6CDB;color:#1F5FD0;background:#F7FAFF}

  /* 输入 */
  .composer{flex:0 0 auto;display:flex;gap:9px;padding:10px 18px 14px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;height:42px;max-height:120px;padding:10px 12px;font-family:inherit;
        font-size:12.8px;line-height:1.5;color:#12293F;background:#fff;border:1px solid #D7DFE9;
        border-radius:9px;outline:none}
  .composer textarea:focus{border-color:#3E6CDB;box-shadow:0 0 0 2px rgba(62,108,219,.12)}
  .composer textarea:disabled{background:#F5F7FA;color:#A9B4C0}
  .composer .btn{height:42px;padding:0 18px;border-radius:9px}
  .foot{flex:0 0 auto;padding:0 18px 10px;font-size:10.5px;color:#A9B4C0}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9AA6B2}
  .empty .t{font-size:13px;color:#5B6B7C}
  .empty .d{font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="row">
      <div class="brand"><span class="ico">📋</span>需求状态追踪助手<span class="sub">POC</span></div>
      <div class="grow"></div>
      <div class="who">
        <span>当前用户</span>
        <select id="userSel"><option value="">请选择姓名</option></select>
        <span>或输入</span>
        <input id="userInput" placeholder="姓名" autocomplete="off">
        <button class="btn" id="applyBtn">应用</button>
      </div>
    </div>
  </div>

  <div class="scope" id="scopeBar">
    <span class="tag">权限</span>
    <div id="scopeText">请先选择或输入本人姓名。未确认身份前不能查询任何需求单；流程口径类问题可不登录直接问。</div>
  </div>

  <div class="msgs" id="msgs">
    <div class="empty" id="welcome">
      <div class="t">选择身份后即可查询</div>
      <div class="d">只能查询本人申请，或本人参与审核/处理的需求单</div>
    </div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="composer">
    <textarea id="q" placeholder="请先在上方选择或输入姓名" disabled></textarea>
    <button class="btn" id="sendBtn" disabled>发送</button>
  </div>
  <div class="foot">只展示状态与轨迹，不做催办、不预测审批结果；数字均由服务端计算。</div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = { user: "", conv: "", busy: false, scoped: 0 };

/* ---------------- markdown ---------------- */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
               .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
               .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
}
function md2html(md){
  const lines = md.split(/\r?\n/);
  let html = "", list = null, tbl = null;
  const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  const closeTbl = () => { if (tbl) { html += "</tbody></table>"; tbl = null; } };
  const cells = l => l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c => c.trim());
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\s+$/,"");
    if (!line.trim()) { closeList(); closeTbl(); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const isSep = /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(line);
      if (!tbl && !isSep && /^\s*\|.*\|\s*$/.test(lines[i+1] || "") &&
          /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1] || "")) {
        closeList();
        tbl = true;
        html += "<table><thead><tr>" + cells(line).map(c => "<th>" + inline(c) + "</th>").join("") +
                "</tr></thead><tbody>";
        i++; continue;
      }
      if (tbl && !isSep) { html += "<tr>" + cells(line).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>"; continue; }
      if (isSep) continue;
    }
    closeTbl();
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); html += "<h3>" + inline(h[2]) + "</h3>"; continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    if (ul) { if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(ul[1]) + "</li>"; continue; }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) { if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(ol[1]) + "</li>"; continue; }
    closeList();
    html += "<p>" + inline(line) + "</p>";
  }
  closeList(); closeTbl();
  return html;
}

/* ---------------- 渲染 ---------------- */
function clearChat(){
  $("msgs").innerHTML = '<div class="empty" id="welcome"><div class="t">可以开始提问了</div>' +
    '<div class="d">试试下方的快捷问题</div></div>';
}
function addUser(text){
  const w = $("welcome"); if (w) w.remove();
  const d = document.createElement("div");
  d.className = "bub bub-u"; d.textContent = text;
  $("msgs").appendChild(d); scroll();
}
function addAnswer(text, meta){
  const d = document.createElement("div");
  d.className = "bub bub-a";
  d.innerHTML = md2html(text) + (meta ? '<div class="meta">' + esc(meta) + "</div>" : "");
  $("msgs").appendChild(d); scroll();
}
function addTyping(){
  const d = document.createElement("div");
  d.className = "typing"; d.id = "typing";
  d.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span><span>正在查询流转数据…</span>';
  $("msgs").appendChild(d); scroll();
}
function scroll(){ const m = $("msgs"); m.scrollTop = m.scrollHeight; }

/* ---------------- 身份 ---------------- */
async function loadUsers(){
  try {
    const r = await fetch("/req/users").then(x => x.json());
    (r.用户 || []).forEach(u => {
      const o = document.createElement("option");
      o.value = u.姓名;
      o.textContent = u.姓名 + " · " + u.角色.join("/") + " · " + u.可见单数 + " 单";
      $("userSel").appendChild(o);
    });
  } catch (e) {
    $("scopeText").textContent = "用户列表加载失败：" + e;
  }
}
async function applyUser(name){
  name = (name || "").trim();
  if (!name) { setLocked("请先选择或输入本人姓名。未确认身份前不能查询任何需求单。", true); return; }
  state.user = name; state.conv = "";
  let d = null;
  try { d = (await fetch("/req/me?user=" + encodeURIComponent(name)).then(r => r.json())).data; }
  catch (e) { /* 忽略，下面按空处理 */ }
  const bar = $("scopeBar");
  if (!d) { setLocked("身份校验失败，请稍后重试。", true); return; }
  state.scoped = d.可见单数;
  if (!d.可见单数) {
    bar.className = "scope warn";
    $("scopeText").innerHTML = "<b>" + esc(name) + "</b> 名下暂无需求单（既非申请人，也非审核/处理人）。" +
      "可以继续提问，但助手只会告知「名下暂无需求单」；如确有需求单，请联系数据共享中心核对账号。";
  } else {
    bar.className = "scope";
    $("scopeText").innerHTML = "当前用户 <b>" + esc(name) + "</b>（" + esc(d.角色.join("、") || "—") + "）" +
      "，可见 <b>" + d.可见单数 + "</b> 张需求单。仅可查询本人申请，或本人参与审核/处理的需求单；" +
      "他人单据一律不可见。";
  }
  unlock();
  clearChat();
  renderChips(d);
}

function setLocked(msg, warn){
  state.user = ""; state.scoped = 0;
  const bar = $("scopeBar");
  bar.className = "scope" + (warn ? " warn" : "");
  $("scopeText").textContent = msg;
  $("q").disabled = true; $("sendBtn").disabled = true;
  $("q").placeholder = "请先在上方选择或输入姓名";
  $("chips").innerHTML = "";
}
function unlock(){
  $("q").disabled = false; $("sendBtn").disabled = false;
  $("q").placeholder = "问点具体的，例如：我的需求单到哪一步了";
}

/* ---------------- 快捷问题 ---------------- */
function renderChips(d){
  const base = [
    "我的需求单到哪一步了",
    "我的需求单整体情况",
    "用数单要经过哪些审核环节"
  ];
  const extra = (d && d.可见单数) ? ["我最近一张单卡在哪个环节"] : [];
  $("chips").innerHTML = "";
  base.concat(extra).forEach(t => {
    const s = document.createElement("span");
    s.className = "chip"; s.textContent = t;
    s.onclick = () => { $("q").value = t; send(); };
    $("chips").appendChild(s);
  });
}

/* ---------------- 发送 ---------------- */
async function send(){
  const q = $("q").value.trim();
  if (!q || state.busy) return;
  if (!state.user) { setLocked("请先选择或输入本人姓名。", true); return; }
  state.busy = true; $("sendBtn").disabled = true;
  addUser(q); $("q").value = ""; addTyping();
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: state.user, query: q, conversation_id: state.conv })
    });
    const d = await r.json();
    document.getElementById("typing").remove();
    if (d.ok) {
      state.conv = d.conversation_id || state.conv;
      addAnswer(d.answer || "（无回答）", "数据截至 " + new Date().toLocaleTimeString("zh-CN") +
        " · 仅展示与本用户相关的需求单");
    } else {
      addAnswer("**查询失败**：" + (d.error || "未知错误"));
    }
  } catch (e) {
    const t = document.getElementById("typing"); if (t) t.remove();
    addAnswer("**请求异常**：" + e);
  }
  state.busy = false; $("sendBtn").disabled = !state.user;
}

/* ---------------- 事件 ---------------- */
$("userSel").onchange = e => { if (e.target.value) { $("userInput").value = ""; applyUser(e.target.value); } };
$("applyBtn").onclick = () => {
  const typed = $("userInput").value.trim();
  applyUser(typed || $("userSel").value);
};
$("userInput").addEventListener("keydown", e => { if (e.key === "Enter") $("applyBtn").click(); });
$("sendBtn").onclick = send;
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

loadUsers().then(() => {
  // 门户跳转可带参：/?user=张枫 自动应用身份（生产由登录态注入）
  const pre = new URLSearchParams(location.search).get("user");
  if (pre) { $("userInput").value = pre; applyUser(pre); }
});
</script>
</body>
</html>
